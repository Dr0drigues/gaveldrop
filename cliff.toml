[changelog]
header = """
# Changelog

Generated from the commit history by git-cliff. Do not edit by hand: run
`TAG=v0.1.7 mise run changelog:write` at release time.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}

"""
trim = true
render_always = true

[git]
# Only full version tags are releases. `v1` is a moving pointer for the action — the convention every
# GitHub action is consumed by — and without this it is read as version 1, which turned a 0.1.3
# changelog into a `## [1]` heading.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
conventional_commits = true
require_conventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^revert", group = "<!-- 5 -->Reverts" },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^test", skip = true },
    { message = "^style", skip = true },
]
filter_commits = true
fail_on_unmatched_commit = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
