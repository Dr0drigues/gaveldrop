[package]
name = "gaveldrop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "YAML-driven test engine: one case is one file."
# Tests of the *repository* rather than of the crate: they run this repository's own cases and
# read `gaveldrop.yaml` two levels above the manifest. In an extracted package that path is
# outside the tree, so shipping them means shipping tests that cannot pass. The dogfooding they
# do is real and stays in the checkout, where those files exist.
exclude = ["tests/own_cases.rs", "tests/repository.rs"]

[dependencies]
gaveldrop-fake = { path = "../gaveldrop-fake", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
schemars.workspace = true
thiserror.workspace = true
anstream.workspace = true
anstyle.workspace = true
glob.workspace = true
tempfile.workspace = true
ureq.workspace = true

[dev-dependencies]
assert_cmd.workspace = true

[lints]
workspace = true
