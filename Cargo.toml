[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dr0drigues/gaveldrop"
keywords = ["testing", "e2e", "yaml", "test-harness", "mocking"]
categories = ["development-tools::testing", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
glob = "0.3"
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
schemars = "1.2.1"
tempfile = "3"
assert_cmd = "2.2.2"
ureq = { version = "3.3", default-features = false }
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
