name: gaveldrop
description: Run YAML-driven test cases, with failures annotated on the line that broke.
author: gaveldrop

# A composite action rather than JavaScript: everything it does is download, verify, install and
# run. A JS action would add a build step, a `node_modules` to commit or bundle, and a runtime whose
# version is another thing to keep working — for no behaviour this shell cannot express.
#
# It lives in the gaveldrop repository rather than in one of its own, and that is deliberate. The tag
# that publishes the binaries is the tag that publishes this file, so the action can never reference
# an archive whose format it does not know. That failure is the usual one for actions kept in a
# separate repository: `v1` of the action quietly meeting `v0.3.0` of the tool.

inputs:
  version:
    description: >
      The release to install, as a tag. Defaults to the version this commit of gaveldrop published,
      read from its own manifest — so `@v1` installs whatever `v1` currently points at, `@v0.1.2`
      installs v0.1.2, and neither needs anything kept in step. Never the *newest* release
      regardless of the ref: that would hand an unknown archive format to a file that predates it.
    required: false
    default: ''
  args:
    description: >
      Arguments for gaveldrop. `--annotate` is the default because the annotation is the reason to
      run this in CI rather than locally: it puts the failure on the line of the assertion.
    required: false
    default: --annotate
  working-directory:
    description: Where `gaveldrop.yaml` lives.
    required: false
    default: .
  install-only:
    description: >
      Install the two binaries, put them on PATH, and stop. For a workflow that shards, or needs the
      report flags decided by a later step.
    required: false
    default: 'false'

outputs:
  binary-directory:
    description: Where the two binaries were installed. Already on PATH.
    value: ${{ steps.install.outputs.directory }}

runs:
  using: composite
  steps:
    - name: Install gaveldrop
      id: install
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # The version this commit of the repository published, read from the one place that already
        # has to be right. Whatever ref resolved this file — `@v0.1.2`, a moving `@v1`, `@main`, a
        # local path — the manifest sitting beside it says which release came with it, so the
        # binaries and the action cannot drift apart and there is no second place to bump.
        #
        # `github.action_ref` was the first attempt and it only works for an exact version tag: a
        # moving `@v1`, which is how every action in the ecosystem is consumed, would have asked for
        # a release named `v1`.
        VERSION="${REQUESTED:-}"
        if [ -z "${VERSION}" ]; then
          manifest="${GITHUB_ACTION_PATH}/../Cargo.toml"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' "${manifest}" | head -1)"
          if [ -z "${declared}" ]; then
            echo "::error::gaveldrop: no version in ${manifest}, and none was passed. Add 'with: { version: v0.1.2 }'"
            exit 1
          fi
          VERSION="v${declared}"
        fi

        # `RUNNER_OS` and `RUNNER_ARCH` are what the runner reports about itself, rather than
        # `uname`, which describes the container and can disagree.
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)    target=x86_64-unknown-linux-musl ;;
          Linux-ARM64)  target=aarch64-unknown-linux-musl ;;
          macOS-X64)    target=x86_64-apple-darwin ;;
          macOS-ARM64)  target=aarch64-apple-darwin ;;
          *)
            # Windows is not an adjustment, it is another project: isolation rests on symlinks, on
            # PATH and on Unix configuration directories. Saying so beats a download that 404s.
            echo "::error::gaveldrop is Unix only, and this runner is ${RUNNER_OS}-${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        name="gaveldrop-${VERSION}-${target}"
        base="https://github.com/Dr0drigues/gaveldrop/releases/download/${VERSION}"
        work="$(mktemp -d)"

        # A 404 here has one likely cause and `curl: (22)` names none of them. The manifest is bumped
        # in one commit and the tag is pushed in another, so between the two there is a version with
        # no release — and this is what a repository testing `./action` against its own working tree
        # hits every time it cuts one. Saying so turns an investigation into a read.
        if ! curl -fsSL --retry 3 -o "${work}/${name}.tar.gz" "${base}/${name}.tar.gz"; then
          echo "::error::gaveldrop: no release archive at ${base}/${name}.tar.gz."
          if [ -z "${REQUESTED:-}" ]; then
            echo "::error::${VERSION} came from the manifest beside this action. If the version was just bumped, this passes once the tag is pushed and the release workflow has run."
          else
            echo "::error::${VERSION} was requested explicitly. Check that the tag exists and that the release builds ${target}."
          fi
          exit 1
        fi
        curl -fsSL --retry 3 -o "${work}/${name}.tar.gz.sha256" "${base}/${name}.tar.gz.sha256"

        # Verified, not trusted. The archive travels over a network and lands in a job that will run
        # it against your repository; a published checksum costs one command to check.
        cd "${work}"
        if command -v sha256sum >/dev/null; then
          sha256sum -c "${name}.tar.gz.sha256"
        else
          shasum -a 256 -c "${name}.tar.gz.sha256"
        fi

        tar -xzf "${name}.tar.gz"

        # Both binaries, in one directory, side by side. That is the whole reason the release ships
        # an archive: the cli looks for `gaveldrop-fake` beside itself, so nothing here needs a
        # second install and nothing needs PATH beyond this line.
        directory="${RUNNER_TEMP}/gaveldrop-bin"
        mkdir -p "${directory}"
        install "${name}/gaveldrop" "${name}/gaveldrop-fake" "${directory}/"

        echo "${directory}" >> "${GITHUB_PATH}"
        echo "directory=${directory}" >> "${GITHUB_OUTPUT}"

        "${directory}/gaveldrop" --version

        # And on the run's summary page, not only in this log. A consumer pinned to `@v1` is moved to a
        # new release by a tag they never touched: the version was already printed above, and a line
        # nobody expands is a line nobody reads. Reported by a consumer whose continuous integration had
        # been on a release seven versions newer than the one their own commits mentioned.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          if [ -z "${REQUESTED:-}" ]; then
            echo "gaveldrop \`${VERSION}\`, from the ref that resolved this action." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "gaveldrop \`${VERSION}\`, requested explicitly." >> "${GITHUB_STEP_SUMMARY}"
          fi
        fi

    - name: Run the cases
      if: inputs.install-only != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Unquoted on purpose: `args` is a command line, and quoting it would make `--annotate
      # --report-junit junit.xml` a single argument. Whoever writes the workflow already controls
      # every other `run:` in it, so there is nothing here they could not do directly.
      run: gaveldrop ${{ inputs.args }}
