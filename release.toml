allow-branch = ["main"]
shared-version = true
tag-name = "v{{version}}"
tag-message = "v{{version}}"
pre-release-commit-message = "chore(release): v{{version}}"
consolidate-commits = true
publish = false
push = false
pre-release-hook = ["git-cliff", "--tag", "{{version}}", "--output", "CHANGELOG.md"]
