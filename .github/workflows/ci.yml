name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: Gates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Versions
        run: rustc --version && cargo --version && cargo clippy --version && zsh --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins 1.97 for everything else, so this job installs the floor
      # and runs through `rustup run` — which bypasses that file, where `cargo +1.88` would
      # not even be a valid command.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      - uses: Swatinem/rust-cache@v2

      # `rust-version = "1.88"` is a promise made to whoever depends on these crates, and
      # until this job existed nothing kept it: every gate ran on the pinned 1.97, so the
      # floor could have risen — ours or a dependency's — without a single check going red.
      # `check`, not `test`: the promise is that the crates compile on it.
      - name: Check
        run: rustup run 1.88 cargo check --workspace --all-targets

  action:
    name: Action
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      # Three of this repository's cases have a zsh function as their subject, and the action does
      # not install the tools a project's cases need — only gaveldrop. macOS ships zsh, Linux does
      # not, so this job failed on both Linux runners and passed on macOS the first time it ran.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # `./action`, not a tag: this checks the action **in this commit**, which is the only version
      # a review can do anything about. Referencing `Dr0drigues/gaveldrop/action@v0.1.4` here would
      # test the released copy and go green on a pull request that broke the one being merged.
      #
      # The binaries it installs are the released ones, so this proves the action — the download,
      # the checksum, the two binaries landing side by side, the suite running — and not the code
      # in this commit. `cargo test --workspace` does that.
      # No `version:`, deliberately: this exercises the path every real caller takes, where the
      # action reads the version out of the manifest beside it. It also means a bump landing here
      # before its release is published turns this job red — which is the right moment to find out.
      - uses: ./action
        with:
          args: --annotate --verbose

  macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

  pages:
    name: Report (Pages)
    # `main` only. A pull request publishing over the page would make the link in the README show
    # whatever branch ran last, which is worse than showing nothing.
    if: github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release

      # `|| true` because this job publishes rather than judges. `gates` is the check that fails a
      # push; a report is most worth reading precisely when something broke, so a failing suite must
      # still reach the page. The badge carries the verdict, so nothing here hides it.
      - name: Run the suite and render it
        run: |
          mkdir -p site
          PATH="$PWD/target/release:$PATH" gaveldrop \
            --report-html site/index.html \
            --report-badge site/badge.svg || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
